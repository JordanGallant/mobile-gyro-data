<!DOCTYPE html>
<html>
<head>
  <title>Gyro Camera Control</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@babylonjs/viewer@8.9.1/dist/babylon-viewer.esm.min.js"></script>
  <style>
    html, body { width: 100%; height: 100%; padding: 0; margin: 0; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
    .overlay {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: rgba(0,0,0,0.5);
      padding: 1rem;
      border-radius: 8px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <!-- Babylon Viewer -->
  <babylon-viewer id="babylonViewer"
    source="https://assets.babylonjs.com/meshes/Demos/optimized/acrobaticPlane_variants.glb"
    camera-behaviors="autoRotate"
    camera-auto-rotate-speed="0"
    camera-orbit="0 1.5 10"
    camera-target="0 1 0"
    shadow-quality="medium"
  ></babylon-viewer>

  <!-- Overlay Info -->
  <div class="overlay" id="status">Connecting to server...</div>

  <script>
    let socket;
    let viewer;
    let lastUpdate = 0;

    function updateStatus(msg) {
      document.getElementById("status").textContent = msg;
    }

    // Wait until viewer is loaded
    window.addEventListener("DOMContentLoaded", () => {
      viewer = document.getElementById("babylonViewer");

      // Connect WebSocket
      connectWebSocket();
    });

    function connectWebSocket() {
      updateStatus("Connecting to server...");
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${location.host}`;

      socket = new WebSocket(wsUrl);

      socket.onopen = () => {
        socket.send(JSON.stringify({ type: "viewer" }));
        updateStatus("Connected - Awaiting gyro data...");
      };

      socket.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === "gyro") {
            applyGyroToCamera(data);
            updateStatus("Receiving gyroscope data...");
          }
        } catch (e) {
          console.error("Error parsing message:", e);
        }
      };

      socket.onclose = () => {
        updateStatus("Disconnected. Retrying...");
        setTimeout(connectWebSocket, 3000);
      };

      socket.onerror = (err) => {
        console.error("WebSocket error:", err);
        updateStatus("Connection error");
      };
    }

    function applyGyroToCamera({ alpha, beta, gamma }) {
      lastUpdate = Date.now();

      if (!viewer || !viewer.sceneManager || !viewer.sceneManager.activeCamera) return;
      const camera = viewer.sceneManager.activeCamera;

      // Convert degrees to radians
      const toRad = deg => deg * Math.PI / 180;

      // Adjust angles as needed based on your preferred mapping
      const azimuthal = toRad(alpha || 0); // around Y
      const polar = toRad(90 - (beta || 0)); // up/down

      camera.alpha = azimuthal;  // horizontal orbit
      camera.beta = Math.max(0.1, Math.min(Math.PI - 0.1, polar)); // vertical tilt, clamp to avoid flipping
    }

    // Fallback if data gets stale
    setInterval(() => {
      if (lastUpdate && (Date.now() - lastUpdate > 5000)) {
        updateStatus("No recent gyro data");
      }
    }, 1000);
  </script>
</body>
</html>
